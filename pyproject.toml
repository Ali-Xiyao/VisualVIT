[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualvit-route-c"
version = "0.1.0"
description = "TIER-CXR-VLM / PRTA-CXR longitudinal chest X-ray research code"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.24",
    "pandas>=2.3",
    "Pillow>=12",
    "transformers>=5.5",
    "accelerate>=1.11",
    "qwen-vl-utils>=0.0.14",
]

[project.optional-dependencies]
test = ["pytest>=9"]
generation = ["peft>=0.18"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
